<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Costos para Emprendedores</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f0f2f5; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: white; border-radius: 16px; padding: 2rem; max-width: 480px; width: 100%; border: 0.5px solid rgba(0,0,0,0.1); }
    h1 { font-family: 'DM Serif Display', serif; font-size: 26px; font-weight: 400; margin-bottom: 6px; }
    .sub { font-size: 14px; color: #666; margin-bottom: 2rem; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 5px; }
    .prefix-wrap { position: relative; }
    .prefix { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #999; }
    input { width: 100%; height: 40px; padding: 0 12px 0 36px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111; transition: border-color 0.15s; }
    input:focus { outline: none; border-color: #1a6ef5; box-shadow: 0 0 0 3px rgba(26,110,245,0.1); }
    .btn { width: 100%; height: 44px; background: #1a6ef5; color: white; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .btn:hover { background: #1559d6; }
    .result { display: none; margin-top: 1.5rem; padding: 1.25rem; background: #e8f0fe; border-radius: 10px; text-align: center; }
    .result-label { font-size: 12px; color: #1a4db5; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .result-val { font-size: 32px; font-weight: 600; color: #1a6ef5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de Costos</h1>
    <p class="sub">Ingresa tus costos en bolivianos y obtén el total al instante.</p>

    <div class="field">
      <label>Materia prima</label>
      <div class="prefix-wrap">
        <span class="prefix">Bs.</span>
        <input type="number" id="materia" placeholder="0.00" min="0" step="0.01" oninput="calcular()" />
      </div>
    </div>

    <div class="field">
      <label>Transporte</label>
      <div class="prefix-wrap">
        <span class="prefix">Bs.</span>
        <input type="number" id="transporte" placeholder="0.00" min="0" step="0.01" oninput="calcular()" />
      </div>
    </div>

    <div class="field">
      <label>Mano de obra</label>
      <div class="prefix-wrap">
        <span class="prefix">Bs.</span>
        <input type="number" id="mano" placeholder="0.00" min="0" step="0.01" oninput="calcular()" />
      </div>
    </div>

    <button class="btn" onclick="calcular()">Calcular costo total</button>

    <div class="result" id="resultado">
      <div class="result-label">Costo total</div>
      <div class="result-val" id="total">Bs. 0.00</div>
    </div>
  </div>

  <script>
    function calcular() {
      const m = parseFloat(document.getElementById('materia').value) || 0;
      const t = parseFloat(document.getElementById('transporte').value) || 0;
      const o = parseFloat(document.getElementById('mano').value) || 0;
      const total = m + t + o;
      document.getElementById('total').textContent = 'Bs. ' + total.toFixed(2);
      document.getElementById('resultado').style.display = 'block';
    }
  </script>
</body>
</html>
